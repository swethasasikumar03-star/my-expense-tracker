<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<meta name="description" content="Simple daily expense and monthly income tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>My Expense Tracker</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#202124;--muted:#6b7280;--accent:#6c63ff;--border:#e6e8ef;--danger:#d93025}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--accent);color:white;padding:22px 18px 26px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:25px} header p{margin:5px 0 0;opacity:.9}
main{max-width:900px;margin:auto;padding:16px 14px 90px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}
.monthbar{display:flex;gap:8px;align-items:center}.monthbar select{flex:1}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:14px;border-radius:15px;background:#fafaff}.stat small{color:var(--muted)}.stat b{display:block;font-size:20px;margin-top:4px}
input,select,button,textarea{font:inherit;width:100%;border:1px solid var(--border);border-radius:11px;padding:11px;background:white}
button{background:var(--accent);color:#fff;border:0;font-weight:700;cursor:pointer}
button.secondary{background:#eeeef6;color:#333}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.priority{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.priority label{font-size:11px;text-align:center;border:1px solid var(--border);padding:8px 3px;border-radius:10px;cursor:pointer}.priority input{display:none}.priority input:checked+span{font-weight:800}.p-essential{background:#fff0f0}.p-important{background:#fff6e6}.p-personal{background:#fffde8}.p-fun{background:#effbf1}.p-unnecessary{background:#f1f2f5}
h2{font-size:18px;margin:0 0 13px}.expense{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}.expense:last-child{border-bottom:0}.expense b{font-size:15px}.expense small{display:block;color:var(--muted);margin-top:3px}.expense-right{text-align:right;white-space:nowrap}.delete{width:auto;padding:5px 8px;background:#fff0f0;color:var(--danger);margin-top:5px;font-size:12px}
.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;background:var(--accent);border-radius:99px}
.empty{text-align:center;color:var(--muted);padding:18px}.section-title{display:flex;justify-content:space-between;align-items:center}.section-title span{font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tabs button{background:#e9e8ff;color:#4b45bd}.tabs button.active{background:var(--accent);color:#fff}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .full{grid-column:1/-1}}
</style>
</head>
<body>
<header><h1>💰 My Expense Tracker</h1><p>Simple daily spending tracker</p></header>
<main>
<div class="card monthbar">
<select id="monthSelect"></select>
<button class="secondary" onclick="setCurrentMonth()">Current month</button>
</div>

<div class="tabs">
<button id="expenseTab" class="active" onclick="showTab('expense')">➕ Daily Expense</button>
<button id="incomeTab" onclick="showTab('income')">💵 Monthly Income</button>
</div>

<section id="expenseForm" class="card">
<h2>Add Expense</h2>
<div class="formgrid">
<div class="field"><label>Amount (₹)</label><input id="amount" type="number" min="0" step="0.01" placeholder="e.g. 250"></div>
<div class="field"><label>Date</label><input id="date" type="date"></div>
<div class="field"><label>Category</label><select id="category"></select></div>
<div class="field"><label>Payment method</label><select id="payment"><option>UPI</option><option>Cash</option><option>Card</option><option>Bank transfer</option><option>Other</option></select></div>
<div class="field full"><label>Priority / reason for spending</label>
<div class="priority">
<label class="p-essential"><input type="radio" name="priority" value="Essential" checked><span>🔴<br>Essential</span></label>
<label class="p-important"><input type="radio" name="priority" value="Important"><span>🟠<br>Important</span></label>
<label class="p-personal"><input type="radio" name="priority" value="Personal"><span>🟡<br>Personal</span></label>
<label class="p-fun"><input type="radio" name="priority" value="Treat / Fun"><span>🟢<br>Treat/Fun</span></label>
<label class="p-unnecessary"><input type="radio" name="priority" value="Unnecessary"><span>⚪<br>Unnecessary</span></label>
</div></div>
<div class="field full"><label>Note (optional)</label><input id="note" placeholder="What was this expense for?"></div>
<div class="full"><button onclick="addExpense()">Save Expense</button></div>
</div>
</section>

<section id="incomeForm" class="card" style="display:none">
<h2>Monthly Income</h2>
<p style="color:var(--muted);font-size:14px">Enter your income once for each month. You can update it later.</p>
<div class="field"><label>Income for selected month (₹)</label><input id="income" type="number" min="0" step="0.01" placeholder="e.g. 30000"></div>
<button onclick="saveIncome()">Save Monthly Income</button>
</section>

<div class="grid">
<div class="card stat"><small>Monthly income</small><b id="totalIncome">₹0</b></div>
<div class="card stat"><small>Total expenses</small><b id="totalExpense">₹0</b></div>
<div class="card stat"><small>Remaining</small><b id="remaining">₹0</b></div>
<div class="card stat"><small>Expenses recorded</small><b id="count">0</b></div>
</div>

<section class="card">
<div class="section-title"><h2>📊 Spending by category</h2><span id="categoryHint"></span></div>
<div id="categories"></div>
</section>

<section class="card">
<div class="section-title"><h2>🎯 Why did I spend?</h2><span>priority breakdown</span></div>
<div id="priorities"></div>
</section>

<section class="card">
<div class="section-title"><h2>🧾 Daily expenses</h2><span id="expenseHint"></span></div>
<div id="expenseList"></div>
</section>

<div class="card">
<button class="secondary" onclick="exportCSV()">⬇️ Export expenses to CSV</button>
</div>
</main>

<script>
const categories=["Food","Snack","Transport","Shopping","Rent","Medicine","Entertainment","Savings","Fruits","Online Delivery / Quick Commerce","Miscellaneous","Others"];
const payments=["UPI","Cash","Card","Bank transfer","Other"];
const priorities=["Essential","Important","Personal","Treat / Fun","Unnecessary"];
let data=JSON.parse(localStorage.getItem("expenseTrackerData")||'{"expenses":[],"income":{}}');

const $=id=>document.getElementById(id);
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});}
function ym(date){return date.slice(0,7);}
function monthName(v){let [y,m]=v.split("-");return new Date(y,m-1,1).toLocaleString("en-IN",{month:"long",year:"numeric"});}
function save(){localStorage.setItem("expenseTrackerData",JSON.stringify(data));render();}
function init(){
 categories.forEach(c=>$("category").insertAdjacentHTML("beforeend",`<option>${c}</option>`));
 $("date").value=new Date().toISOString().slice(0,10);
 let now=new Date(), start=now.getFullYear()-1, end=now.getFullYear()+1;
 for(let y=start;y<=end;y++)for(let m=1;m<=12;m++){let v=`${y}-${String(m).padStart(2,"0")}`;$("monthSelect").insertAdjacentHTML("beforeend",`<option value="${v}">${monthName(v)}</option>`);}
 setCurrentMonth(); render();
}
function setCurrentMonth(){ $("monthSelect").value=new Date().toISOString().slice(0,7); render(); }
$("monthSelect").onchange=()=>{render(); if($("date").value.slice(0,7)!=$("monthSelect").value)$("date").value=$("monthSelect").value+"-01";}
function selected(){return $("monthSelect").value;}
function addExpense(){
 let amount=Number($("amount").value), date=$("date").value;
 if(!amount||amount<=0||!date){alert("Please enter amount and date.");return;}
 let priority=document.querySelector('input[name="priority"]:checked').value;
 data.expenses.push({id:Date.now(),amount,date,category:$("category").value,payment:$("payment").value,priority,note:$("note").value.trim()});
 $("amount").value="";$("note").value="";save();
}
function saveIncome(){
 let val=Number($("income").value);
 if(isNaN(val)||val<0){alert("Please enter a valid income.");return;}
 data.income[selected()]=val; save(); alert("Monthly income saved.");
}
function showTab(tab){
 $("expenseForm").style.display=tab==="expense"?"block":"none";
 $("incomeForm").style.display=tab==="income"?"block":"none";
 $("expenseTab").classList.toggle("active",tab==="expense");$("incomeTab").classList.toggle("active",tab==="income");
 if(tab==="income")$("income").value=data.income[selected()]??"";
}
function render(){
 let m=selected(), ex=data.expenses.filter(e=>ym(e.date)===m), income=Number(data.income[m]||0), total=ex.reduce((s,e)=>s+e.amount,0);
 $("totalIncome").textContent=money(income);$("totalExpense").textContent=money(total);$("remaining").textContent=money(income-total);$("count").textContent=ex.length;
 $("categoryHint").textContent=monthName(m);$("expenseHint").textContent=monthName(m);
 let catTotals={}; ex.forEach(e=>catTotals[e.category]=(catTotals[e.category]||0)+e.amount);
 let max=Math.max(1,...Object.values(catTotals));
 $("categories").innerHTML=categories.filter(c=>catTotals[c]).map(c=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${c}</span><b>${money(catTotals[c])}</b></div><div class="bar"><div class="fill" style="width:${catTotals[c]/max*100}%"></div></div></div>`).join("")||'<div class="empty">No expenses this month.</div>';
 let pTotals={}; priorities.forEach(p=>pTotals[p]=0);ex.forEach(e=>pTotals[e.priority]=(pTotals[e.priority]||0)+e.amount);
 $("priorities").innerHTML=priorities.map(p=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${p}</span><b>${money(pTotals[p])}</b></div><div class="bar"><div class="fill" style="width:${total?pTotals[p]/total*100:0}%"></div></div></div>`).join("");
 ex.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 $("expenseList").innerHTML=ex.map(e=>`<div class="expense"><div><b>${e.category}</b><small>${e.date} · ${e.priority} · ${e.payment}${e.note?" · "+e.note:""}</small></div><div class="expense-right"><b>${money(e.amount)}</b><br><button class="delete" onclick="deleteExpense(${e.id})">Delete</button></div></div>`).join("")||'<div class="empty">No expenses recorded yet.</div>';
}
function deleteExpense(id){if(confirm("Delete this expense?")){data.expenses=data.expenses.filter(e=>e.id!==id);save();}}
function exportCSV(){
 let rows=[["Date","Amount","Category","Priority","Payment Method","Note"],...data.expenses.map(e=>[e.date,e.amount,e.category,e.priority,e.payment,e.note])];
 let csv=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")).join("\n");
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="my_expenses.csv";a.click();
}
init();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
